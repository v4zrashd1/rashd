<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer & Stopwatch — V4ZRASHD</title>
    <script defer src="/_vercel/insights/script.js"></script>
    <style>
        :root { --bg:#0a0a0f; --card:#1a1a24; --accent:#6c5ce7; --accent2:#00cec9; --text:#e9e9f0; --muted:#8b8ba3; --border:#2a2a38; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1.5rem; }
        .container { max-width:480px; width:100%; }
        .card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:2rem; text-align:center; }
        h1 { font-size:1.5rem; margin-bottom:0.25rem; }
        h1 span { background:linear-gradient(135deg,var(--accent),var(--accent2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
        .sub { color:var(--muted); font-size:0.85rem; margin-bottom:1.5rem; }
        .tabs { display:flex; gap:0.5rem; margin-bottom:1.5rem; }
        .tab { flex:1; padding:0.6rem; border-radius:10px; border:1px solid var(--border); background:transparent; color:var(--muted); font-size:0.85rem; cursor:pointer; transition:all 0.3s; }
        .tab.active { background:var(--accent); color:white; border-color:var(--accent); }
        .display { font-family:monospace; font-size:clamp(2.5rem,10vw,4rem); font-weight:700; padding:1rem 0; letter-spacing:2px; }
        .display .ms { font-size:0.45em; color:var(--muted); }
        .controls { display:flex; gap:0.75rem; justify-content:center; flex-wrap:wrap; margin:1rem 0; }
        .btn { padding:0.8rem 1.75rem; border:none; border-radius:10px; font-weight:600; font-size:0.95rem; cursor:pointer; transition:all 0.3s; }
        .btn-start { background:linear-gradient(135deg,#27ae60,#00cec9); color:white; }
        .btn-stop { background:linear-gradient(135deg,#e74c3c,#fd79a8); color:white; }
        .btn-reset { background:transparent; border:1px solid var(--border); color:var(--muted); }
        .btn:hover { transform:translateY(-2px); }
        .btn:disabled { opacity:0.4; cursor:default; transform:none; }
        .presets { display:grid; grid-template-columns:repeat(4,1fr); gap:0.5rem; margin:1rem 0; }
        .preset { padding:0.55rem; border-radius:8px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:0.8rem; cursor:pointer; }
        .preset:hover { border-color:var(--accent2); color:var(--accent2); }
        .custom-time { display:flex; gap:0.5rem; justify-content:center; margin-bottom:1rem; }
        .custom-time input { width:65px; background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:0.5rem; color:var(--text); text-align:center; font-size:0.9rem; outline:none; }
        .custom-time label { color:var(--muted); font-size:0.7rem; display:block; margin-top:0.2rem; }
        .laps { text-align:left; max-height:150px; overflow-y:auto; margin-top:1rem; }
        .lap { display:flex; justify-content:space-between; padding:0.5rem 0.75rem; border-bottom:1px solid var(--border); font-size:0.85rem; font-family:monospace; }
        .lap span:first-child { color:var(--muted); }
        .hidden { display:none !important; }
        .back { text-align:center; margin-top:1.5rem; }
        .back a { color:var(--accent2); text-decoration:none; font-size:0.85rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>⏱️ <span>Timer & Stopwatch</span></h1>
            <p class="sub">কাউন্টডাউন টাইমার আর স্টপওয়াচ</p>
            <div class="tabs">
                <button class="tab active" id="tabSw" onclick="switchTab('sw')">⏱️ Stopwatch</button>
                <button class="tab" id="tabTm" onclick="switchTab('tm')">⏲️ Timer</button>
            </div>

            <!-- Stopwatch -->
            <div id="swPanel">
                <div class="display"><span id="swTime">00:00<span class="ms">.00</span></span></div>
                <div class="controls">
                    <button class="btn btn-start" id="swStart" onclick="swToggle()">▶️ Start</button>
                    <button class="btn btn-reset" onclick="swReset()">🔄 Reset</button>
                    <button class="btn btn-stop" id="swLap" onclick="swLap()">🚩 Lap</button>
                </div>
                <div class="laps" id="swLaps"></div>
            </div>

            <!-- Timer -->
            <div id="tmPanel" class="hidden">
                <div class="display"><span id="tmTime">10:00</span></div>
                <div class="presets">
                    <button class="preset" onclick="setTimer(1)">1 min</button>
                    <button class="preset" onclick="setTimer(5)">5 min</button>
                    <button class="preset" onclick="setTimer(10)">10 min</button>
                    <button class="preset" onclick="setTimer(25)">25 min</button>
                </div>
                <div class="custom-time">
                    <div><input type="number" id="tmMin" min="0" max="999" value="10"><label>মিনিট</label></div>
                    <div><input type="number" id="tmSec" min="0" max="59" value="0"><label>সেকেন্ড</label></div>
                </div>
                <div class="controls">
                    <button class="btn btn-start" id="tmStart" onclick="tmToggle()">▶️ Start</button>
                    <button class="btn btn-reset" onclick="tmReset()">🔄 Reset</button>
                </div>
            </div>
        </div>
        <div class="back"><a href="/">← হোমে ফিরুন</a></div>
    </div>

    <script>
        // Stopwatch
        let swRunning=false, swStartT=0, swElapsed=0, swRaf=null, swLapCount=0;
        function swTick() {
            const t = swElapsed + (performance.now()-swStartT);
            document.getElementById('swTime').innerHTML = fmtSw(t);
            swRaf = requestAnimationFrame(swTick);
        }
        function fmtSw(ms) {
            const m=Math.floor(ms/60000), s=Math.floor((ms%60000)/1000), c=Math.floor((ms%1000)/10);
            return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+'<span class="ms">.'+String(c).padStart(2,'0')+'</span>';
        }
        function swToggle() {
            const b=document.getElementById('swStart');
            if (swRunning) {
                swElapsed += performance.now()-swStartT;
                cancelAnimationFrame(swRaf); swRunning=false;
                b.textContent='▶️ Start'; b.className='btn btn-start';
            } else {
                swStartT=performance.now(); swRunning=true; swTick();
                b.textContent='⏸️ Pause'; b.className='btn btn-stop';
            }
        }
        function swReset() {
            cancelAnimationFrame(swRaf); swRunning=false; swElapsed=0; swLapCount=0;
            document.getElementById('swTime').innerHTML='00:00<span class="ms">.00</span>';
            document.getElementById('swLaps').innerHTML='';
            const b=document.getElementById('swStart'); b.textContent='▶️ Start'; b.className='btn btn-start';
        }
        function swLap() {
            if (!swRunning) return;
            swLapCount++;
            const t = swElapsed + (performance.now()-swStartT);
            const div=document.createElement('div');
            div.className='lap';
            div.innerHTML='<span>Lap '+swLapCount+'</span><span>'+fmtSw(t)+'</span>';
            const laps=document.getElementById('swLaps');
            laps.prepend(div);
        }

        // Timer
        let tmRunning=false, tmEndT=0, tmTotal=600000, tmRaf=null;
        function fmtTm(ms) {
            const m=Math.floor(ms/60000), s=Math.floor((ms%60000)/1000);
            return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
        }
        function tmTick() {
            const left = tmEndT - performance.now();
            if (left<=0) {
                document.getElementById('tmTime').textContent='00:00';
                tmFinish(); return;
            }
            document.getElementById('tmTime').textContent=fmtTm(left);
            tmRaf=requestAnimationFrame(tmTick);
        }
        function tmFinish() {
            tmRunning=false; cancelAnimationFrame(tmRaf);
            const b=document.getElementById('tmStart'); b.textContent='▶️ Start'; b.className='btn btn-start';
            if (navigator.vibrate) navigator.vibrate([200,100,200,100,200]);
            alert('⏰ সময় শেষ! টাইমার ডেডলাইনে পৌঁছেছে।');
        }
        function tmToggle() {
            const b=document.getElementById('tmStart');
            if (tmRunning) {
                tmTotal = tmEndT - performance.now();
                cancelAnimationFrame(tmRaf); tmRunning=false;
                b.textContent='▶️ Resume'; b.className='btn btn-start';
            } else {
                tmEndT = performance.now()+tmTotal; tmRunning=true; tmTick();
                b.textContent='⏸️ Pause'; b.className='btn btn-stop';
            }
        }
        function setTimer(min) {
            const m=document.getElementById('tmMin'), s=document.getElementById('tmSec');
            m.value=min; s.value=0;
            tmTotal=min*60000;
            document.getElementById('tmTime').textContent=fmtTm(tmTotal);
        }
        function tmReset() {
            cancelAnimationFrame(tmRaf); tmRunning=false;
            const m=+document.getElementById('tmMin').value||0, s=+document.getElementById('tmSec').value||0;
            tmTotal=(m*60+s)*1000;
            document.getElementById('tmTime').textContent=fmtTm(tmTotal);
            const b=document.getElementById('tmStart'); b.textContent='▶️ Start'; b.className='btn btn-start';
        }
        ['tmMin','tmSec'].forEach(function(id){
            document.getElementById(id).addEventListener('change', tmReset);
        });
        function switchTab(tab) {
            if (tab==='sw') {
                document.getElementById('swPanel').classList.remove('hidden');
                document.getElementById('tmPanel').classList.add('hidden');
                document.getElementById('tabSw').classList.add('active');
                document.getElementById('tabTm').classList.remove('active');
            } else {
                document.getElementById('tmPanel').classList.remove('hidden');
                document.getElementById('swPanel').classList.add('hidden');
                document.getElementById('tabTm').classList.add('active');
                document.getElementById('tabSw').classList.remove('active');
            }
        }
        tmReset();
    </script>
</body>
</html>
