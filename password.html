<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator — V4ZRASHD</title>
    <script defer src="/_vercel/insights/script.js"></script>
    <style>
        :root { --bg:#0a0a0f; --card:#1a1a24; --accent:#6c5ce7; --accent2:#00cec9; --text:#e9e9f0; --muted:#8b8ba3; --border:#2a2a38; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1.5rem; }
        .container { max-width:480px; width:100%; }
        .card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:2rem; }
        h1 { font-size:1.5rem; margin-bottom:0.25rem; }
        h1 span { background:linear-gradient(135deg,var(--accent),var(--accent2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
        .sub { color:var(--muted); font-size:0.85rem; margin-bottom:1.5rem; }
        .display { background:var(--bg); border:1px solid var(--border); border-radius:12px; padding:1rem; font-family:monospace; font-size:1.15rem; word-break:break-all; min-height:60px; display:flex; align-items:center; margin-bottom:1rem; user-select:all; }
        .display.empty { color:var(--muted); font-style:italic; font-family:inherit; }
        .row { display:flex; gap:0.75rem; margin-bottom:1rem; }
        .btn { flex:1; padding:0.8rem; border:none; border-radius:10px; font-weight:600; font-size:0.95rem; cursor:pointer; transition:all 0.3s; }
        .btn-gen { background:linear-gradient(135deg,var(--accent),var(--accent2)); color:white; }
        .btn-gen:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(108,92,231,0.4); }
        .btn-copy { background:transparent; border:1px solid var(--border); color:var(--text); }
        .btn-copy:hover { border-color:var(--accent2); color:var(--accent2); }
        .opt { margin-bottom:1rem; }
        .opt label { display:flex; justify-content:space-between; align-items:center; color:var(--muted); font-size:0.9rem; margin-bottom:0.5rem; }
        input[type=range] { width:100%; accent-color:var(--accent); }
        .checks { display:grid; grid-template-columns:1fr 1fr; gap:0.6rem; margin-bottom:1.5rem; }
        .check { display:flex; align-items:center; gap:0.5rem; color:var(--muted); font-size:0.85rem; cursor:pointer; }
        .check input { accent-color:var(--accent2); width:16px; height:16px; }
        .strength { height:6px; background:var(--border); border-radius:3px; margin-bottom:0.5rem; overflow:hidden; }
        .strength-bar { height:100%; border-radius:3px; transition:all 0.4s; width:0; }
        .strength-label { font-size:0.8rem; color:var(--muted); margin-bottom:1rem; }
        .back { text-align:center; margin-top:1.5rem; }
        .back a { color:var(--accent2); text-decoration:none; font-size:0.85rem; }
        .toast { position:fixed; bottom:2rem; left:50%; transform:translateX(-50%); background:var(--accent2); color:#000; padding:0.75rem 1.5rem; border-radius:50px; font-weight:600; opacity:0; transition:opacity 0.3s; pointer-events:none; }
        .toast.show { opacity:1; }
        @media(max-width:480px) { .checks { grid-template-columns:1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>🔐 <span>Password Generator</span></h1>
            <p class="sub">শক্তিশালী র‍্যান্ডম পাসওয়ার্ড বানান</p>
            <div class="display empty" id="display">এখানে পাসওয়ার্ড দেখাবে</div>
            <div class="strength"><div class="strength-bar" id="strengthBar"></div></div>
            <div class="strength-label" id="strengthLabel">Strength: —</div>
            <div class="opt">
                <label>দৈর্ঘ্য: <strong id="lenLabel">16</strong></label>
                <input type="range" id="length" min="4" max="64" value="16">
            </div>
            <div class="checks">
                <label class="check"><input type="checkbox" id="upper" checked> বড় অক্ষর (A-Z)</label>
                <label class="check"><input type="checkbox" id="lower" checked> ছোট অক্ষর (a-z)</label>
                <label class="check"><input type="checkbox" id="number" checked> সংখ্যা (0-9)</label>
                <label class="check"><input type="checkbox" id="symbol" checked> চিহ্ন (!@#$%)</label>
            </div>
            <div class="row">
                <button class="btn btn-gen" onclick="generate()">🔄 Generate</button>
                <button class="btn btn-copy" onclick="copyPass()">📋 Copy</button>
            </div>
        </div>
        <div class="back"><a href="/">← হোমে ফিরুন</a></div>
    </div>
    <div class="toast" id="toast">কপি হয়েছে! ✓</div>

    <script>
        const sets = {
            upper:'ABCDEFGHIJKLMNOPQRSTUVWXYZ', lower:'abcdefghijklmnopqrstuvwxyz',
            number:'0123456789', symbol:'!@#$%^&*()_+-=[]{}|;:,.<>?'
        };
        function generate() {
            let pool='', out='';
            ['upper','lower','number','symbol'].forEach(function(k){
                if (document.getElementById(k).checked) pool += sets[k];
            });
            if (!pool) { document.getElementById('display').textContent='অন্তত একটি অপশন বেছে নিন'; return; }
            const len = +document.getElementById('length').value;
            const arr = new Uint32Array(len);
            crypto.getRandomValues(arr);
            for (let i=0;i<len;i++) out += pool[arr[i] % pool.length];
            const d = document.getElementById('display');
            d.textContent = out; d.classList.remove('empty');
            updateStrength(out);
        }
        function updateStrength(pw) {
            let score = 0;
            if (pw.length>=8) score++; if (pw.length>=16) score++; if (pw.length>=24) score++;
            const variety = ['upper','lower','number','symbol'].filter(function(k){
                return new RegExp(k==='number'?'[0-9]':k==='symbol'?'[^a-zA-Z0-9]':'['+sets[k][0]+'-'+sets[k][sets[k].length-1]+']').test(pw);
            }).length;
            score += Math.min(variety,4);
            const pct = Math.min(score*100/7,100);
            const bar = document.getElementById('strengthBar');
            bar.style.width = pct+'%';
            bar.style.background = pct<40?'#e74c3c':pct<70?'#f39c12':'#27ae60';
            document.getElementById('strengthLabel').textContent = 'Strength: '+(pct<40?'দুর্বল 💪':pct<70?'ভালো 👍':'শক্তিশালী 🔥')+' ('+Math.round(pct)+'%)';
        }
        function copyPass() {
            const txt = document.getElementById('display').textContent;
            if (!txt || txt.includes('এখানে')) return;
            navigator.clipboard.writeText(txt).then(function(){
                const t = document.getElementById('toast'); t.classList.add('show');
                setTimeout(function(){ t.classList.remove('show'); }, 1500);
            });
        }
        document.getElementById('length').addEventListener('input', function(){
            document.getElementById('lenLabel').textContent = this.value;
        });
        generate();
    </script>
</body>
</html>
