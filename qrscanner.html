<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Scanner — V4ZRASHD</title>
    <script defer src="/_vercel/insights/script.js"></script>
    <style>
        :root { --bg:#0a0a0f; --card:#1a1a24; --accent:#6c5ce7; --accent2:#00cec9; --text:#e9e9f0; --muted:#8b8ba3; --border:#2a2a38; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1.5rem; }
        .container { max-width:480px; width:100%; }
        .card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:2rem; text-align:center; }
        h1 { font-size:1.5rem; margin-bottom:0.25rem; }
        h1 span { background:linear-gradient(135deg,var(--accent),var(--accent2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
        .sub { color:var(--muted); font-size:0.85rem; margin-bottom:1.5rem; }
        .scanner-box { background:#000; border-radius:12px; aspect-ratio:1; margin:1rem auto; max-width:300px; position:relative; overflow:hidden; display:flex; align-items:center; justify-content:center; }
        .scanner-box video, .scanner-box canvas { width:100%; height:100%; object-fit:cover; }
        .scanner-box .placeholder { color:var(--muted); font-size:0.85rem; }
        .scan-line { position:absolute; left:10%; right:10%; height:2px; background:var(--accent2); box-shadow:0 0 10px var(--accent2); animation:scan 2s linear infinite; }
        @keyframes scan { 0% { top:15%; } 50% { top:80%; } 100% { top:15%; } }
        .btn { width:100%; padding:0.85rem; border:none; border-radius:10px; font-weight:600; font-size:0.95rem; cursor:pointer; background:linear-gradient(135deg,var(--accent),var(--accent2)); color:white; transition:all 0.3s; margin-bottom:0.75rem; }
        .btn:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(108,92,231,0.4); }
        .btn:disabled { opacity:0.5; cursor:wait; transform:none; }
        .result { background:var(--bg); border:1px solid var(--accent2); border-radius:12px; padding:1rem; margin-top:1rem; display:none; text-align:left; }
        .result.show { display:block; }
        .result label { color:var(--muted); font-size:0.75rem; display:block; margin-bottom:0.4rem; }
        .result-text { font-family:monospace; font-size:1rem; color:var(--accent2); word-break:break-all; user-select:all; }
        .result-actions { display:flex; gap:0.5rem; margin-top:0.75rem; }
        .btn-sm { flex:1; padding:0.55rem; border-radius:8px; border:1px solid var(--border); background:transparent; color:var(--text); font-size:0.8rem; cursor:pointer; }
        .btn-sm:hover { border-color:var(--accent2); color:var(--accent2); }
        .err { color:#e74c3c; font-size:0.85rem; margin-top:0.75rem; display:none; }
        .back { text-align:center; margin-top:1.5rem; }
        .back a { color:var(--accent2); text-decoration:none; font-size:0.85rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>🔍 <span>QR Code Scanner</span></h1>
            <p class="sub">ক্যামেরা দিয়ে QR কোড স্ক্যান করুন — তাৎক্ষণিক ফলাফল</p>
            <div class="scanner-box" id="scannerBox">
                <span class="placeholder">📷 ক্যামেরা চালু করুন</span>
                <div class="scan-line" id="scanLine" style="display:none"></div>
            </div>
            <button class="btn" id="startBtn" onclick="startScanner()">📷 ক্যামেরা চালু করুন</button>
            <button class="btn" id="stopBtn" style="display:none; background:transparent; border:1px solid var(--border); color:var(--muted)" onclick="stopScanner()">⏹️ বন্ধ করুন</button>
            <div class="err" id="err"></div>
            <div class="result" id="result">
                <label>✅ স্ক্যান ফলাফল:</label>
                <div class="result-text" id="resultText"></div>
                <div class="result-actions">
                    <button class="btn-sm" onclick="copyResult()">📋 Copy</button>
                    <button class="btn-sm" onclick="openResult()">🔗 Open</button>
                    <button class="btn-sm" onclick="makeQR()">📊 QR বানান</button>
                </div>
            </div>
        </div>
        <div class="back"><a href="/">← হোমে ফিরুন</a></div>
    </div>

    <script>
        let stream = null, scanning = false, rafId = null;
        const box = document.getElementById('scannerBox');

        async function startScanner() {
            const err = document.getElementById('err');
            err.style.display = 'none';
            const btn = document.getElementById('startBtn');
            btn.disabled = true; btn.textContent = '⏳ ক্যামেরা চালু হচ্ছে...';
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' }
                });
                const video = document.createElement('video');
                video.setAttribute('playsinline', 'true');
                video.srcObject = stream;
                box.innerHTML = '';
                box.appendChild(video);
                const line = document.createElement('div');
                line.className = 'scan-line'; line.id = 'scanLine';
                box.appendChild(line);
                await video.play();
                scanning = true;
                btn.style.display = 'none';
                document.getElementById('stopBtn').style.display = 'block';
                scanLoop(video);
            } catch (ex) {
                err.textContent = '❌ ক্যামেরা অ্যাক্সেস ব্যর্থ: ' + (ex.message || 'অনুমতি দিন');
                err.style.display = 'block';
                btn.disabled = false; btn.textContent = '📷 আবার চেষ্টা করুন';
            }
        }

        function scanLoop(video) {
            if (!scanning) return;
            // Check for QR using jsQR if available, else manual canvas check
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                const canvas = document.createElement('canvas');
                const w = video.videoWidth || 300, h = video.videoHeight || 300;
                canvas.width = w; canvas.height = h;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, w, h);
                // Try jsQR
                if (window.jsQR) {
                    const imgData = ctx.getImageData(0, 0, w, h);
                    const code = jsQR(imgData.data, w, h, { inversionAttempts: 'dontInvert' });
                    if (code && code.data) {
                        showResult(code.data);
                        stopScanner();
                        return;
                    }
                }
            }
            rafId = requestAnimationFrame(function(){ scanLoop(video); });
        }

        function stopScanner() {
            scanning = false;
            if (rafId) cancelAnimationFrame(rafId);
            if (stream) {
                stream.getTracks().forEach(function(t){ t.stop(); });
                stream = null;
            }
            box.innerHTML = '<span class="placeholder">📷 ক্যামেরা বন্ধ</span>';
            const btn = document.getElementById('startBtn');
            btn.style.display = 'block'; btn.disabled = false; btn.textContent = '📷 আবার স্ক্যান করুন';
            document.getElementById('stopBtn').style.display = 'none';
        }

        let lastResult = '';
        function showResult(text) {
            lastResult = text;
            document.getElementById('resultText').textContent = text;
            document.getElementById('result').classList.add('show');
        }
        function copyResult() {
            if (lastResult) navigator.clipboard.writeText(lastResult);
        }
        function openResult() {
            if (lastResult) {
                const url = lastResult.startsWith('http') ? lastResult : 'https://' + lastResult;
                window.open(url, '_blank');
            }
        }
        function makeQR() {
            if (lastResult) location.href = '/qrcode.html?text=' + encodeURIComponent(lastResult);
        }
        // Load jsQR library
        const s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';
        document.head.appendChild(s);
    </script>
</body>
</html>
