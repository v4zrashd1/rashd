<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Downloader Pro — V4ZRASHD</title>
    <script defer src="/_vercel/insights/script.js"></script>
    <style>
        :root { --bg:#0a0a0f; --card:#1a1a24; --accent:#6c5ce7; --accent2:#00cec9; --accent3:#fd79a8; --text:#e9e9f0; --muted:#8b8ba3; --border:#2a2a38; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; min-height:100vh; padding:4rem 1.5rem 2rem; }
        .container { max-width:680px; margin:0 auto; }
        .card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:2rem; }
        h1 { font-size:1.5rem; text-align:center; margin-bottom:0.25rem; }
        h1 span { background:linear-gradient(135deg,var(--accent),var(--accent2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
        .sub { color:var(--muted); font-size:0.85rem; text-align:center; margin-bottom:1.25rem; }
        .pro-badge { display:inline-block; padding:0.2rem 0.8rem; border-radius:50px; background:linear-gradient(135deg,var(--accent3),var(--accent)); color:white; font-size:0.68rem; font-weight:700; margin-left:0.4rem; vertical-align:middle; }
        .platforms { display:flex; gap:0.4rem; flex-wrap:wrap; margin:0.75rem 0 1.25rem; justify-content:center; }
        .platform { padding:0.3rem 0.65rem; border-radius:50px; border:1px solid var(--border); color:var(--muted); font-size:0.68rem; }
        .platform.ok { border-color:rgba(0,206,201,0.4); color:var(--accent2); }
        input[type=url] { width:100%; background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:0.85rem 1rem; color:var(--text); font-size:0.95rem; margin-bottom:0.75rem; outline:none; transition:border-color 0.3s; }
        input:focus { border-color:var(--accent); }
        .row { display:flex; gap:0.75rem; }
        .btn { padding:0.85rem 1.5rem; border:none; border-radius:10px; font-weight:600; font-size:0.95rem; cursor:pointer; transition:all 0.3s; }
        .btn-gen { flex:1; background:linear-gradient(135deg,var(--accent),var(--accent2)); color:white; }
        .btn-gen:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(108,92,231,0.4); }
        .btn-gen:disabled { opacity:0.5; cursor:wait; transform:none; }
        .btn-audio { background:transparent; border:1px solid var(--border); color:var(--muted); }
        .btn-audio:hover { border-color:var(--accent3); color:var(--accent3); }
        .btn-audio.on { border-color:var(--accent3); color:var(--accent3); background:rgba(253,121,168,0.08); }
        .mode-note { font-size:0.72rem; color:var(--muted); text-align:center; margin-bottom:0.6rem; }
        .result { background:var(--bg); border:1px solid var(--border); border-radius:12px; padding:1rem; margin-top:1rem; display:none; }
        .result.show { display:block; }
        .result-thumb { width:100%; border-radius:10px; margin-bottom:0.75rem; max-height:220px; object-fit:cover; }
        .result-title { font-size:0.95rem; margin-bottom:0.5rem; line-height:1.4; }
        .result-meta { font-size:0.75rem; color:var(--muted); margin-bottom:0.75rem; }
        .dl-link { display:flex; align-items:center; gap:0.75rem; background:var(--card); border:1px solid var(--border); border-radius:10px; padding:0.75rem 1rem; margin-bottom:0.5rem; text-decoration:none; color:var(--text); transition:all 0.3s; }
        .dl-link:hover { border-color:var(--accent2); transform:translateX(4px); }
        .dl-icon { font-size:1.25rem; }
        .dl-info { flex:1; min-width:0; }
        .dl-quality { font-size:0.85rem; font-weight:600; }
        .dl-size { font-size:0.72rem; color:var(--muted); }
        .dl-arrow { color:var(--accent2); font-size:1.1rem; }
        .err { color:#e74c3c; font-size:0.85rem; margin-top:0.75rem; display:none; text-align:center; }
        .spinner { display:inline-block; width:14px; height:14px; border:2px solid rgba(255,255,255,0.3); border-top-color:white; border-radius:50%; animation:spin 0.8s linear infinite; vertical-align:middle; margin-right:0.4rem; }
        @keyframes spin { to { transform:rotate(360deg); } }
        .telegram-note { margin-top:1.25rem; padding:0.85rem 1rem; background:rgba(34,158,217,0.08); border:1px solid rgba(34,158,217,0.3); border-radius:10px; font-size:0.8rem; color:var(--muted); text-align:center; }
        .telegram-note a { color:#229ED9; text-decoration:none; font-weight:600; }
        .back { text-align:center; margin-top:1.5rem; }
        .back a { color:var(--accent2); text-decoration:none; font-size:0.85rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>🎬 <span>Video Downloader</span><span class="pro-badge">PRO</span></h1>
            <p class="sub">যেকোনো ভিডিও, যেকোনো সাইজ — ফ্রি, দ্রুত, ওয়াটারমার্ক ছাড়া</p>
            <div class="platforms">
                <span class="platform ok">▶️ YouTube</span>
                <span class="platform ok">🎵 TikTok</span>
                <span class="platform ok">📸 Instagram</span>
                <span class="platform ok">🐦 Twitter/X</span>
                <span class="platform ok">📘 Facebook</span>
                <span class="platform ok">🎙️ Reddit</span>
                <span class="platform ok">📺 Shorts</span>
            </div>
            <p class="mode-note" id="modeNote">📹 ভিডিও মোড — সব কোয়ালিটি দেখাবে</p>
            <form onsubmit="download(event)">
                <input type="url" id="url" placeholder="https://youtube.com/watch?v=... লিংক দিন" required>
                <div class="row">
                    <button class="btn btn-gen" id="btn" type="submit">⬇️ ডাউনলোড করুন</button>
                    <button class="btn btn-audio" type="button" id="audioBtn" onclick="toggleMode()">🎵 MP3 মোড</button>
                </div>
            </form>
            <div class="err" id="err"></div>
            <div class="result" id="result">
                <img class="result-thumb" id="thumb" alt="">
                <div class="result-title" id="resultTitle"></div>
                <div class="result-meta" id="resultMeta"></div>
                <div id="links"></div>
            </div>
            <div class="telegram-note">
                💡 বড় ভিডিও (৪৫MB+) বা এই পেজে না পেলে আমার টেলিগ্রাম বট ব্যবহার করুন — <a href="https://t.me/v4zvideodownloadbot" target="_blank">@v4zvideodownloadbot</a>
            </div>
        </div>
        <div class="back"><a href="/">← হোমে ফিরুন</a></div>
    </div>

    <script>
        let mode = 'video';
        const PIPED = 'https://api.piped.private.coffee';
        const TIKWM = 'https://www.tikwm.com/api/';

        function toggleMode() {
            mode = mode === 'video' ? 'audio' : 'video';
            const b = document.getElementById('audioBtn');
            const n = document.getElementById('modeNote');
            if (mode === 'audio') {
                b.classList.add('on');
                n.textContent = '🎵 অডিও মোড — MP3 / M4A ডাউনলোড হবে';
            } else {
                b.classList.remove('on');
                n.textContent = '📹 ভিডিও মোড — সব কোয়ালিটি দেখাবে';
            }
        }

        function detectPlatform(url) {
            const u = url.toLowerCase();
            if (u.includes('youtube.com') || u.includes('youtu.be')) return 'youtube';
            if (u.includes('tiktok.com')) return 'tiktok';
            if (u.includes('instagram.com')) return 'instagram';
            if (u.includes('twitter.com') || u.includes('x.com')) return 'twitter';
            if (u.includes('reddit.com')) return 'reddit';
            if (u.includes('facebook.com') || u.includes('fb.watch')) return 'facebook';
            return 'unknown';
        }

        function extractYouTubeId(url) {
            const m = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/shorts\/|youtube\.com\/embed\/)([a-zA-Z0-9_-]{11})/);
            return m ? m[1] : null;
        }

        async function download(e) {
            e.preventDefault();
            const url = document.getElementById('url').value.trim();
            const btn = document.getElementById('btn');
            const err = document.getElementById('err');
            const res = document.getElementById('result');
            err.style.display = 'none';
            res.classList.remove('show');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span>প্রসেস হচ্ছে...';
            try {
                const platform = detectPlatform(url);
                if (platform === 'youtube') await doYouTube(url);
                else if (platform === 'tiktok' || platform === 'instagram' || platform === 'facebook' || platform === 'twitter' || platform === 'reddit') await doTikWM(url, platform);
                else throw new Error('এই প্ল্যাটফর্মটি সাপোর্ট করে না। YouTube, TikTok, Instagram, Facebook, Twitter বা Reddit লিংক দিন।');
            } catch (ex) {
                err.textContent = '❌ ' + (ex.message || 'ডাউনলোড ব্যর্থ। লিংক সঠিক কিনা দেখুন।');
                err.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.innerHTML = '⬇️ ডাউনলোড করুন';
            }
        }

        function showResult(thumb, title, meta) {
            const res = document.getElementById('result');
            const t = document.getElementById('thumb');
            if (thumb) { t.src = thumb; t.style.display = 'block'; } else { t.style.display = 'none'; }
            document.getElementById('resultTitle').textContent = title;
            document.getElementById('resultMeta').textContent = meta;
            document.getElementById('links').innerHTML = '';
            res.classList.add('show');
        }

        function addLink(url, icon, quality, size, filename) {
            const links = document.getElementById('links');
            const a = document.createElement('a');
            a.className = 'dl-link';
            a.href = url; a.target = '_blank'; a.download = filename || '';
            a.innerHTML = '<span class="dl-icon">' + icon + '</span><div class="dl-info"><div class="dl-quality">' + quality + '</div><div class="dl-size">' + size + '</div></div><span class="dl-arrow">⬇️</span>';
            links.appendChild(a);
        }

        function fmtSize(bytes) {
            if (!bytes) return '';
            const mb = bytes / (1024 * 1024);
            if (mb < 1) return Math.round(bytes / 1024) + ' KB';
            return mb.toFixed(1) + ' MB';
        }

        function fmtDuration(sec) {
            if (!sec) return '';
            const m = Math.floor(sec / 60), s = sec % 60;
            return m + ':' + String(s).padStart(2, '0');
        }

        // ============ YOUTUBE (Piped — unlimited size) ============
        async function doYouTube(url) {
            const vid = extractYouTubeId(url);
            if (!vid) throw new Error('সঠিক YouTube লিংক দিন');
            const r = await fetch(PIPED + '/streams/' + vid, { headers: { 'Accept': 'application/json' } });
            if (!r.ok) throw new Error('ভিডিও তথ্য পাওয়া যায়নি (সার্ভার ব্যস্ত)। একটু পরে চেষ্টা করুন।');
            const d = await r.json();
            if (d.error) throw new Error(d.error);
            const title = d.title || 'YouTube Video';
            const dur = d.duration || 0;
            showResult(d.thumbnailUrl, title, '⏱ ' + fmtDuration(dur) + ' | ▶️ YouTube');

            if (mode === 'audio') {
                const audios = d.audioStreams || [];
                const m4a = audios.find(a => a.mimeType && a.mimeType.includes('mp4'));
                const best = m4a || audios[0];
                if (best) {
                    addLink(best.url, '🎵', 'MP3 অডিও ' + (best.quality || ''), fmtSize(best.bitrate ? best.bitrate * dur / 8 : 0), title.slice(0,50) + '.mp3');
                    return;
                }
                const v = (d.videoStreams || []).find(v => v.mimeType && v.mimeType.includes('mp4') && v.url);
                if (v) addLink(v.url, '🎬', 'ভিডিও (অডিও সহ)', v.quality || '', title.slice(0,50) + '.mp4');
                else throw new Error('এই ভিডিওর কোনো অডিও নেই');
                return;
            }

            // video mode — show ALL qualities, best first
            const vids = (d.videoStreams || []).filter(v => v.mimeType && v.mimeType.includes('mp4') && v.url);
            const seen = {};
            let added = 0;
            vids.sort((a, b) => {
                const qa = parseInt(a.quality) || 0, qb = parseInt(b.quality) || 0;
                return qb - qa;
            });
            vids.forEach(v => {
                const q = v.quality || '?';
                if (seen[q]) return;
                seen[q] = true;
                added++;
                const isLbry = q.includes('LBRY');
                const label = isLbry ? 'সর্বোচ্চ কোয়ালিটি (LBRY)' : q + ' MP4';
                addLink(v.url, '🎬', label, fmtSize(v.bitrate ? v.bitrate * dur / 8 : 0), title.slice(0,50) + '.mp4');
            });
            if (!added) {
                const any = (d.videoStreams || []).find(v => v.url);
                if (any) addLink(any.url, '🎬', 'ভিডিও', any.quality || '', title.slice(0,50) + '.mp4');
                else throw new Error('কোনো ডাউনলোডযোগ্য স্ট্রিম পাওয়া যায়নি');
            }
        }

        // ============ TIKTOK / INSTAGRAM / FACEBOOK / TWITTER / REDDIT ============
        async function doTikWM(url, platform) {
            const r = await fetch(TIKWM + '?url=' + encodeURIComponent(url), {
                headers: { 'Accept': 'application/json' }
            });
            if (!r.ok) throw new Error(platform + ' ভিডিও তথ্য পাওয়া যায়নি');
            const d = await r.json();
            if (d.code !== 0 || !d.data) throw new Error(d.msg || platform + ' ভিডিও পাওয়া যায়নি। লিংকটি পাবলিক কিনা দেখুন।');
            const data = d.data;
            const title = (data.title || data.desc || platform + ' Video').slice(0, 100);
            const icon = { tiktok:'🎵', instagram:'📸', facebook:'📘', twitter:'🐦', reddit:'🎙️' }[platform] || '🎬';
            showResult(data.cover, title, '⏱ ' + fmtDuration(data.duration) + ' | ' + icon + ' ' + platform);

            if (mode === 'audio') {
                if (data.music) addLink(data.music, '🎵', 'MP3 অডিও', '', ((data.music_info && data.music_info.title) || 'audio').slice(0,40) + '.mp3');
                else throw new Error('এই ভিডিওর কোনো মিউজিক স্ট্রিম নেই');
                return;
            }
            if (data.hdplay) addLink(data.hdplay, '✨', 'HD কোয়ালিটি', fmtSize(data.hd_size), title.slice(0,40) + '_hd.mp4');
            if (data.play) addLink(data.play, '🎬', 'ওয়াটারমার্ক ছাড়া', fmtSize(data.size), title.slice(0,40) + '.mp4');
            if (data.wmplay) addLink(data.wmplay, '🎬', 'ওয়াটারমার্ক সহ', fmtSize(data.wm_size), title.slice(0,40) + '_wm.mp4');
            if (data.url) addLink(data.url, '🎬', 'ভিডিও', '', title.slice(0,40) + '.mp4');
            if (!data.hdplay && !data.play && !data.wmplay && !data.url) throw new Error('কোনো ডাউনলোডযোগ্য স্ট্রিম পাওয়া যায়নি');
        }
    </script>
</body>
</html>
