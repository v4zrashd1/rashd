<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>অপেক্ষা করুন...</title>
    
    <!-- ============ 2 নম্বর: Monetag ============ -->
    <meta name="monetag" content="b3a0bad47159adbdc1fef5b9a4cce7e2">
    
    <!-- ============ 1 নম্বর: Quge5 Ad Script ============ -->
    <script src="https://quge5.com/88/tag.min.js" data-zone="262222" async data-cfasync="false"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #fff;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 40px 30px;
            max-width: 450px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        
        .icon {
            font-size: 60px;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            font-weight: 700;
        }
        
        .subtitle {
            font-size: 14px;
            opacity: 0.8;
            margin-bottom: 30px;
        }
        
        /* ============ টাইমার সার্কেল ============ */
        .timer-container {
            position: relative;
            width: 180px;
            height: 180px;
            margin: 0 auto 30px;
        }
        
        .timer-svg {
            transform: rotate(-90deg);
            width: 180px;
            height: 180px;
        }
        
        .timer-bg {
            fill: none;
            stroke: rgba(255, 255, 255, 0.15);
            stroke-width: 12;
        }
        
        .timer-progress {
            fill: none;
            stroke: #00ff88;
            stroke-width: 12;
            stroke-linecap: round;
            stroke-dasharray: 502;
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 1s linear;
            filter: drop-shadow(0 0 8px #00ff88);
        }
        
        .timer-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            font-weight: 800;
            color: #00ff88;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
        }
        
        .timer-label {
            position: absolute;
            top: 65%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 12px;
            opacity: 0.7;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        /* ============ কী বক্স ============ */
        .key-box {
            display: none;
            animation: fadeIn 0.6s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .key-icon {
            font-size: 60px;
            margin-bottom: 15px;
            animation: bounce 1s infinite;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        .key-title {
            color: #00ff88;
            font-size: 20px;
            margin-bottom: 20px;
            font-weight: 700;
        }
        
        .key-display {
            background: rgba(0, 0, 0, 0.4);
            border: 2px dashed #00ff88;
            border-radius: 12px;
            padding: 20px;
            margin: 20px 0;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 4px;
            color: #00ff88;
            word-break: break-all;
            font-family: 'Courier New', monospace;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }
        
        .copy-btn {
            background: linear-gradient(135deg, #00ff88, #00cc6a);
            color: #000;
            border: none;
            padding: 15px 40px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            margin-top: 10px;
            box-shadow: 0 8px 25px rgba(0, 255, 136, 0.3);
        }
        
        .copy-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(0, 255, 136, 0.5);
        }
        
        .copy-btn:active {
            transform: translateY(0);
        }
        
        .copy-btn.copied {
            background: linear-gradient(135deg, #28a745, #1e7e34);
            color: #fff;
        }
        
        .note {
            font-size: 12px;
            opacity: 0.6;
            margin-top: 20px;
            line-height: 1.6;
        }
        
        /* ============ লোডিং ============ */
        .loading-dots {
            display: inline-block;
        }
        
        .loading-dots span {
            animation: blink 1.4s infinite both;
        }
        
        .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
        .loading-dots span:nth-child(3) { animation-delay: 0.4s; }
        
        @keyframes blink {
            0%, 80%, 100% { opacity: 0.3; }
            40% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        
        <!-- ============ টাইমার সেকশন ============ -->
        <div id="timerSection">
            <div class="icon">⏳</div>
            <h1>অনুগ্রহ করে অপেক্ষা করুন</h1>
            <p class="subtitle">বিজ্ঞাপন লোড হচ্ছে<span class="loading-dots"><span>.</span><span>.</span><span>.</span></span></p>
            
            <div class="timer-container">
                <svg class="timer-svg" viewBox="0 0 180 180">
                    <circle class="timer-bg" cx="90" cy="90" r="80"></circle>
                    <circle class="timer-progress" id="progressCircle" cx="90" cy="90" r="80"></circle>
                </svg>
                <div class="timer-text" id="timerText">50</div>
                <div class="timer-label">সেকেন্ড</div>
            </div>
            
            <p class="note">⏱️ টাইমার শেষ হলে আপনার কী (Key) দেখানো হবে</p>
        </div>
        
        <!-- ============ কী সেকশন ============ -->
        <div class="key-box" id="keyBox">
            <div class="key-icon">🎉</div>
            <div class="key-title">✅ আপনার কী তৈরি হয়েছে!</div>
            
            <div class="key-display" id="keyDisplay">----</div>
            
            <button class="copy-btn" id="copyBtn" onclick="copyKey()">
                📋 কী কপি করুন
            </button>
            
            <p class="note">
                ⚠️ এই কী সংরক্ষণ করুন।<br>
                টাইমার শেষ, এখন আপনি কী ব্যবহার করতে পারবেন।
            </p>
        </div>
        
    </div>

    <script>
        // ============ কনফিগারেশন ============
        const WAIT_SECONDS = 50;   // ⏱️ কত সেকেন্ড অপেক্ষা করবে
        const KEY_LENGTH = 12;      // 🔑 কী এর দৈর্ঘ্য
        
        // ============ ভেরিয়েবল ============
        let timeLeft = WAIT_SECONDS;
        let generatedKey = '';
        const circumference = 2 * Math.PI * 80; // r = 80
        
        const progressCircle = document.getElementById('progressCircle');
        const timerText = document.getElementById('timerText');
        const timerSection = document.getElementById('timerSection');
        const keyBox = document.getElementById('keyBox');
        const keyDisplay = document.getElementById('keyDisplay');
        
        // ============ কী জেনারেট ============
        function generateKey() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let key = '';
            for (let i = 0; i < KEY_LENGTH; i++) {
                key += chars.charAt(Math.floor(Math.random() * chars.length));
                // প্রতি ৪ অক্ষরে ড্যাশ
                if ((i + 1) % 4 === 0 && i !== KEY_LENGTH - 1) {
                    key += '-';
                }
            }
            return key;
        }
        
        // ============ টাইমার শুরু ============
        function startTimer() {
            // প্রথমবার progress circle সেট
            progressCircle.style.strokeDasharray = circumference;
            progressCircle.style.strokeDashoffset = 0;
            
            const interval = setInterval(() => {
                timeLeft--;
                
                // টেক্সট আপডেট
                timerText.textContent = timeLeft;
                
                // প্রগ্রেস সার্কেল আপডেট
                const offset = circumference * ((WAIT_SECONDS - timeLeft) / WAIT_SECONDS);
                progressCircle.style.strokeDashoffset = offset;
                
                // ⚡ শেষ ১০ সেকেন্ডে লাল রঙ
                if (timeLeft <= 10) {
                    progressCircle.style.stroke = '#ff4757';
                    timerText.style.color = '#ff4757';
                    progressCircle.style.filter = 'drop-shadow(0 0 8px #ff4757)';
                }
                
                // 🎉 টাইমার শেষ
                if (timeLeft <= 0) {
                    clearInterval(interval);
                    finishTimer();
                }
            }, 1000);
        }
        
        // ============ টাইমার শেষ ============
        function finishTimer() {
            // কী জেনারেট
            generatedKey = generateKey();
            keyDisplay.textContent = generatedKey;
            
            // টাইমার হাইড, কী দেখাও
            timerSection.style.display = 'none';
            keyBox.style.display = 'block';
            
            // 🔊 সাউন্ড (ঐচ্ছিক)
            try {
                const audio = new Audio('data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2/LDciUFLIHO8tiJNwgZaLvt559NEAxQp+PwtmMcBjiR1/LMeSwFJHfH8N2QQAoUXrTp66hVFApGn+DyvmwhBSuBzvLZiTYIG2m98OScTgwOUarm7blmGgU7k9n1unEiBC13yO/eizEIHWq+8+OWT');
                audio.volume = 0.3;
                audio.play().catch(() => {});
            } catch(e) {}
        }
        
        // ============ কী কপি ============
        function copyKey() {
            const btn = document.getElementById('copyBtn');
            
            // মডার্ন ক্লিপবোর্ড API
            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(generatedKey).then(() => {
                    showCopied(btn);
                }).catch(() => {
                    fallbackCopy(generatedKey, btn);
                });
            } else {
                fallbackCopy(generatedKey, btn);
            }
        }
        
        function fallbackCopy(text, btn) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showCopied(btn);
            } catch(e) {
                alert('কপি করতে সমস্যা হয়েছে। ম্যানুয়ালি কপি করুন:\n\n' + text);
            }
            document.body.removeChild(textarea);
        }
        
        function showCopied(btn) {
            btn.textContent = '✅ কপি হয়েছে!';
            btn.classList.add('copied');
            setTimeout(() => {
                btn.textContent = '📋 কী কপি করুন';
                btn.classList.remove('copied');
            }, 2000);
        }
        
        // ============ শুরু ============
        window.addEventListener('DOMContentLoaded', () => {
            // ⚠️ ২ সেকেন্ড পর টাইমার শুরু (অ্যাড লোড হওয়ার সুযোগ)
            setTimeout(startTimer, 2000);
        });
    </script>
</body>
</html>
