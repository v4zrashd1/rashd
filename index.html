<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V4ZRASHD Downloader</title>
    <meta name="description" content="যেকোনো লিংক দিন — ডাউনলোড করে দিব">
    <style>
        :root {
            --bg: #08080f;
            --card: rgba(22, 22, 36, 0.75);
            --accent: #6c5ce7;
            --accent2: #00cec9;
            --accent3: #fd79a8;
            --text: #e9e9f0;
            --muted: #8b8ba3;
            --border: rgba(108, 92, 231, 0.25);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            color: var(--text);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            overflow: hidden;
            background: var(--bg);
        }

        /* Animated aurora background */
        .aurora {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
        }
        .aurora::before, .aurora::after {
            content: '';
            position: absolute;
            width: 70vmax;
            height: 70vmax;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.35;
            animation: float 14s ease-in-out infinite;
        }
        .aurora::before {
            background: radial-gradient(circle, var(--accent), transparent 60%);
            top: -25%;
            left: -15%;
        }
        .aurora::after {
            background: radial-gradient(circle, var(--accent2), transparent 60%);
            bottom: -30%;
            right: -20%;
            animation-delay: -7s;
        }
        .aurora .blob3 {
            position: absolute;
            width: 50vmax;
            height: 50vmax;
            border-radius: 50%;
            background: radial-gradient(circle, var(--accent3), transparent 60%);
            filter: blur(70px);
            opacity: 0.22;
            top: 30%;
            left: 40%;
            animation: float 18s ease-in-out infinite reverse;
        }
        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(8%, -6%) scale(1.1); }
            66% { transform: translate(-6%, 8%) scale(0.95); }
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 520px;
        }

        .card {
            background: var(--card);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 2.25rem 1.75rem;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5);
            animation: cardIn 0.7s cubic-bezier(0.22, 1, 0.36, 1);
        }
        @keyframes cardIn {
            from { opacity: 0; transform: translateY(28px) scale(0.96); }
            to { opacity: 1; transform: none; }
        }

        .logo {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .logo .dl-icon {
            font-size: 2.6rem;
            display: inline-block;
            animation: bounceIcon 2.4s ease-in-out infinite;
            filter: drop-shadow(0 8px 20px rgba(108, 92, 231, 0.5));
        }
        @keyframes bounceIcon {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .logo h1 {
            font-size: 1.45rem;
            margin-top: 0.4rem;
            letter-spacing: 0.02em;
        }
        .logo h1 .grad {
            background: linear-gradient(135deg, var(--accent), var(--accent2), var(--accent3));
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 3.5s linear infinite;
        }
        @keyframes shimmer {
            to { background-position: 200% center; }
        }
        .logo p {
            color: var(--muted);
            font-size: 0.84rem;
            margin-top: 0.3rem;
        }

        form { margin-top: 1.25rem; }
        .input-wrap { position: relative; }
        input[type=url] {
            width: 100%;
            background: rgba(8, 8, 15, 0.7);
            border: 1.5px solid var(--border);
            border-radius: 14px;
            padding: 0.95rem 1rem 0.95rem 2.9rem;
            color: var(--text);
            font-size: 0.92rem;
            outline: none;
            transition: all 0.35s;
        }
        input[type=url]:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(108, 92, 231, 0.14);
        }
        .input-wrap .link-ico {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            font-size: 0.95rem;
            opacity: 0.5;
        }

        .btn-row { display: flex; gap: 0.6rem; margin-top: 0.75rem; }
        .btn {
            flex: 1;
            padding: 0.95rem 1rem;
            border: none;
            border-radius: 14px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            color: white;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            background-size: 150% auto;
            transition: all 0.35s;
            position: relative;
            overflow: hidden;
        }
        .btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(108, 92, 231, 0.45);
            background-position: right center;
        }
        .btn:active:not(:disabled) { transform: translateY(0) scale(0.98); }
        .btn:disabled { opacity: 0.75; cursor: wait; }
        .btn-ghost {
            flex: 0 0 auto;
            background: transparent;
            border: 1.5px solid var(--border);
            color: var(--muted);
            font-weight: 600;
        }
        .btn-ghost:hover { border-color: var(--accent3); color: var(--accent3); box-shadow: none; }

        /* progress ring + bar */
        .progress-zone {
            margin-top: 1.5rem;
            display: none;
            text-align: center;
            animation: cardIn 0.5s ease;
        }
        .progress-zone.show { display: block; }
        .ring-wrap { position: relative; width: 92px; height: 92px; margin: 0 auto; }
        .ring-wrap svg { transform: rotate(-90deg); }
        .ring-bg, .ring-fg { fill: none; stroke-width: 7; stroke-linecap: round; }
        .ring-bg { stroke: rgba(255,255,255,0.08); }
        .ring-fg {
            stroke: url(#ringGrad);
            stroke-dasharray: 254.5;
            stroke-dashoffset: 254.5;
            transition: stroke-dashoffset 0.4s ease;
            filter: drop-shadow(0 0 8px rgba(0, 206, 201, 0.6));
        }
        .ring-pct {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.15rem;
            font-weight: 800;
        }
        .status-text {
            margin-top: 0.85rem;
            font-size: 0.88rem;
            color: var(--muted);
            min-height: 1.3em;
        }
        .status-text b { color: var(--accent2); }

        /* file info panel */
        .info {
            margin-top: 1.25rem;
            background: rgba(8, 8, 15, 0.6);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 0.9rem 1rem;
            display: none;
            animation: cardIn 0.5s ease;
        }
        .info.show { display: block; }
        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.82rem;
            padding: 0.32rem 0;
        }
        .info-row + .info-row { border-top: 1px solid rgba(255,255,255,0.05); }
        .info-row span:first-child { color: var(--muted); }
        .info-row span:last-child { font-weight: 600; max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .err {
            margin-top: 1rem;
            padding: 0.8rem 1rem;
            background: rgba(231, 76, 60, 0.1);
            border: 1px solid rgba(231, 76, 60, 0.35);
            border-radius: 12px;
            color: #ff7a6b;
            font-size: 0.84rem;
            display: none;
            animation: shake 0.45s ease;
        }
        .err.show { display: block; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-7px); }
            75% { transform: translateX(7px); }
        }

        .done-badge {
            display: none;
            margin-top: 1.25rem;
            padding: 0.9rem;
            border-radius: 14px;
            background: linear-gradient(135deg, rgba(0, 206, 201, 0.14), rgba(108, 92, 231, 0.14));
            border: 1px solid rgba(0, 206, 201, 0.4);
            text-align: center;
            font-weight: 700;
            color: var(--accent2);
            animation: popIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .done-badge.show { display: block; }
        @keyframes popIn {
            from { opacity: 0; transform: scale(0.7); }
            to { opacity: 1; transform: scale(1); }
        }

        .chips { display: flex; gap: 0.45rem; flex-wrap: wrap; justify-content: center; margin-top: 1.4rem; }
        .chip {
            padding: 0.3rem 0.75rem;
            border-radius: 50px;
            border: 1px solid var(--border);
            color: var(--muted);
            font-size: 0.7rem;
            cursor: pointer;
            background: none;
            transition: all 0.25s;
        }
        .chip:hover { border-color: var(--accent2); color: var(--accent2); transform: translateY(-1px); }
        .chips-label { text-align: center; font-size: 0.72rem; color: var(--muted); margin-top: 1.1rem; opacity: 0.8; }

        .foot {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.74rem;
            color: var(--muted);
            opacity: 0.7;
        }
        .foot a { color: var(--accent2); text-decoration: none; font-weight: 600; }

        @media (max-width: 480px) {
            .card { padding: 1.75rem 1.25rem; border-radius: 20px; }
            .logo h1 { font-size: 1.25rem; }
        }
    </style>
</head>
<body>
    <div class="aurora"><div class="blob3"></div></div>

    <div class="container">
        <div class="card">
            <div class="logo">
                <span class="dl-icon">⬇️</span>
                <h1><span class="grad">V4ZRASHD</span> Downloader</h1>
                <p>যেকোনো লিংক দিন — ছবি, ভিডিও, অডিও, ফাইল — ডাউনলোড করে দিব</p>
            </div>

            <form onsubmit="start(event)">
                <div class="input-wrap">
                    <span class="link-ico">🔗</span>
                    <input type="url" id="url" placeholder="https://... যেকোনো লিংক" required autocomplete="off">
                </div>
                <div class="btn-row">
                    <button class="btn" id="go" type="submit">⬇️ ডাউনলোড</button>
                    <button class="btn btn-ghost" type="button" onclick="paste()">📋 পেস্ট</button>
                </div>
            </form>

            <div class="progress-zone" id="pzone">
                <div class="ring-wrap">
                    <svg width="92" height="92">
                        <defs>
                            <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#6c5ce7"/>
                                <stop offset="100%" stop-color="#00cec9"/>
                            </linearGradient>
                        </defs>
                        <circle class="ring-bg" cx="46" cy="46" r="40.5"/>
                        <circle class="ring-fg" id="ring" cx="46" cy="46" r="40.5"/>
                    </svg>
                    <div class="ring-pct" id="pct">0%</div>
                </div>
                <div class="status-text" id="status">সংযোগ হচ্ছে...</div>
            </div>

            <div class="info" id="info">
                <div class="info-row"><span>📄 ফাইল</span><span id="iName">—</span></div>
                <div class="info-row"><span>🗂️ টাইপ</span><span id="iType">—</span></div>
                <div class="info-row"><span>📏 সাইজ</span><span id="iSize">—</span></div>
            </div>

            <div class="done-badge" id="done">✅ ডাউনলোড শুরু হয়েছে!</div>
            <div class="err" id="err"></div>

            <p class="chips-label">💡 উদাহরণ (চাপলে অটো ফিল)</p>
            <div class="chips">
                <button class="chip" onclick="fill('https://images.unsplash.com/photo-1518791841217-8f162f1e1131?w=1200')">🖼️ ছবি</button>
                <button class="chip" onclick="fill('https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3')">🎵 অডিও</button>
                <button class="chip" onclick="fill('https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4')">🎬 ভিডিও</button>
                <button class="chip" onclick="fill('https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf')">📄 পিডিএফ</button>
            </div>

            <div class="foot">⚡ Vercel Edge দিয়ে চলছে · ভিডিও/সোশ্যাল মিডিয়ার জন্য <a href="/video.html">Video PRO</a></div>
        </div>
    </div>

    <script>
        const PROXY = '/api/proxy?url=';
        const $ = id => document.getElementById(id);
        const url = $('url'), go = $('go');
        const pzone = $('pzone'), ring = $('ring'), pct = $('pct'), status = $('status');
        const info = $('info'), done = $('done'), err = $('err');

        function fill(u) { url.value = u; url.focus(); }

        async function paste() {
            try {
                const t = await navigator.clipboard.readText();
                if (t && /^https?:\/\//i.test(t.trim())) { url.value = t.trim(); url.focus(); }
                else { showErr('ক্লিপবোর্ডে লিংক নেই'); }
            } catch (e) { showErr('ক্লিপবোর্ড অ্যাক্সেস ব্যর্থ — নিজে পেস্ট করুন'); }
        }

        function showErr(m) {
            err.textContent = '❌ ' + m;
            err.classList.add('show');
            setTimeout(() => err.classList.remove('show'), 6000);
        }

        function reset() {
            err.classList.remove('show');
            info.classList.remove('show');
            done.classList.remove('show');
            pzone.classList.remove('show');
        }

        function fmtSize(b) {
            if (!b) return 'অজানা';
            const mb = b / 1048576;
            if (mb < 1) return Math.round(b / 1024) + ' KB';
            if (mb < 1024) return mb.toFixed(2) + ' MB';
            return (mb / 1024).toFixed(2) + ' GB';
        }

        function setRing(p) {
            const c = 2 * Math.PI * 40.5;
            ring.style.strokeDasharray = c;
            ring.style.strokeDashoffset = c * (1 - p / 100);
            pct.textContent = Math.min(99, Math.round(p)) + '%';
        }

        async function start(e) {
            e.preventDefault();
            const u = url.value.trim();
            if (!u) return;
            reset();
            go.disabled = true;
            go.innerHTML = '<span class="spin" style="display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite;vertical-align:middle;margin-right:.4rem"></span>অপেক্ষা...';
            const sty = document.createElement('style');
            sty.textContent = '@keyframes sp{to{transform:rotate(360deg)}}';
            document.head.appendChild(sty);

            pzone.classList.add('show');
            setRing(4);
            status.innerHTML = 'সংযোগ হচ্ছে...';

            try {
                // Probe with Range to learn size without downloading the whole file
                const probe = PROXY + encodeURIComponent(u);
                const r = await fetch(probe, { method: 'GET', headers: { 'Range': 'bytes=0-0' } });

                if (!r.ok && r.status !== 206) {
                    let m = 'ডাউনলোড ব্যর্থ (HTTP ' + r.status + ')';
                    try { const j = await r.json(); if (j.error) m = j.error; } catch (_) {}
                    throw new Error(m);
                }

                let size = parseInt(r.headers.get('Content-Length') || '0', 10);
                const cr = r.headers.get('Content-Range');
                if (cr) { const m = cr.match(/\/(\d+)/); if (m) size = parseInt(m[1], 10); }

                const type = (r.headers.get('Content-Type') || 'অজানা').split(';')[0];
                const cd = r.headers.get('Content-Disposition') || '';
                const nm = (cd.match(/filename="?([^"]+)"?/) || [])[1] || u.split('/').pop().split('?')[0] || 'download';

                // consume probe body
                r.body.cancel();

                $('iName').textContent = nm;
                $('iType').textContent = type;
                $('iSize').textContent = fmtSize(size);
                info.classList.add('show');

                status.innerHTML = '⬇️ ডাউনলোড হচ্ছে... <b>' + fmtSize(size) + '</b>';

                // Start real download in browser
                const a = document.createElement('a');
                a.href = probe;
                a.download = nm;
                document.body.appendChild(a);
                a.click();
                a.remove();

                // Animate ring to full (browser handles the actual transfer)
                let p = 12;
                const iv = setInterval(() => {
                    p = Math.min(p + (8 + Math.random() * 22), 97);
                    setRing(p);
                    if (p >= 97) {
                        clearInterval(iv);
                        setRing(100);
                        status.innerHTML = '✅ সম্পূর্ণ!';
                        done.classList.add('show');
                    }
                }, 260);

            } catch (ex) {
                pzone.classList.remove('show');
                showErr(ex.message || 'ডাউনলোড ব্যর্থ — লিংক চেক করুন');
            } finally {
                go.disabled = false;
                go.textContent = '⬇️ আবার ডাউনলোড';
            }
        }
    </script>
</body>
</html>
