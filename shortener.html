<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener — V4ZRASHD</title>
    <script defer src="/_vercel/insights/script.js"></script>
    <style>
        :root { --bg:#0a0a0f; --card:#1a1a24; --accent:#6c5ce7; --accent2:#00cec9; --text:#e9e9f0; --muted:#8b8ba3; --border:#2a2a38; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:1.5rem; }
        .container { max-width:520px; width:100%; }
        .card { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:2rem; }
        h1 { font-size:1.5rem; margin-bottom:0.25rem; }
        h1 span { background:linear-gradient(135deg,var(--accent),var(--accent2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
        .sub { color:var(--muted); font-size:0.85rem; margin-bottom:1.5rem; }
        input[type=url] { width:100%; background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:0.85rem 1rem; color:var(--text); font-size:0.95rem; margin-bottom:0.75rem; outline:none; transition:border-color 0.3s; }
        input[type=url]:focus { border-color:var(--accent); }
        .btn { width:100%; padding:0.85rem; border:none; border-radius:10px; font-weight:600; font-size:0.95rem; cursor:pointer; background:linear-gradient(135deg,var(--accent),var(--accent2)); color:white; transition:all 0.3s; }
        .btn:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(108,92,231,0.4); }
        .btn:disabled { opacity:0.5; cursor:wait; transform:none; }
        .result { background:var(--bg); border:1px solid var(--border); border-radius:12px; padding:1rem; margin-top:1rem; display:none; }
        .result.show { display:block; }
        .result label { color:var(--muted); font-size:0.75rem; display:block; margin-bottom:0.4rem; }
        .short-url { font-family:monospace; font-size:1.05rem; color:var(--accent2); word-break:break-all; user-select:all; }
        .short-url a { color:var(--accent2); text-decoration:none; }
        .result-meta { display:flex; gap:0.5rem; margin-top:0.75rem; }
        .btn-sm { flex:1; padding:0.55rem; border-radius:8px; border:1px solid var(--border); background:transparent; color:var(--text); font-size:0.8rem; cursor:pointer; }
        .btn-sm:hover { border-color:var(--accent2); color:var(--accent2); }
        .err { color:#e74c3c; font-size:0.85rem; margin-top:0.75rem; display:none; }
        .spinner { display:inline-block; width:14px; height:14px; border:2px solid rgba(255,255,255,0.3); border-top-color:white; border-radius:50%; animation:spin 0.8s linear infinite; vertical-align:middle; margin-right:0.4rem; }
        @keyframes spin { to { transform:rotate(360deg); } }
        .back { text-align:center; margin-top:1.5rem; }
        .back a { color:var(--accent2); text-decoration:none; font-size:0.85rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>🌐 <span>URL Shortener</span></h1>
            <p class="sub">লম্বা লিংক ছোট করুন এক ক্লিকে — সম্পূর্ণ ফ্রি</p>
            <form onsubmit="shorten(event)">
                <input type="url" id="url" placeholder="https://example.com/very/long/link..." required>
                <button class="btn" id="btn" type="submit">⚡ Shorten URL</button>
            </form>
            <div class="err" id="err"></div>
            <div class="result" id="result">
                <label>✂️ আপনার ছোট লিংক:</label>
                <div class="short-url" id="shortUrl"></div>
                <div class="result-meta">
                    <button class="btn-sm" onclick="copyShort()">📋 Copy</button>
                    <button class="btn-sm" onclick="openShort()">🔗 Open</button>
                    <button class="btn-sm" onclick="newQR()">📊 QR Code</button>
                </div>
            </div>
        </div>
        <div class="back"><a href="/">← হোমে ফিরুন</a></div>
    </div>

    <script>
        let currentShort = '';
        async function shorten(e) {
            e.preventDefault();
            const url = document.getElementById('url').value.trim();
            const btn = document.getElementById('btn');
            const err = document.getElementById('err');
            const res = document.getElementById('result');
            err.style.display='none'; res.classList.remove('show');
            btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Working...';
            try {
                const r = await fetch('https://is.gd/create.php?format=json&url=' + encodeURIComponent(url));
                const d = await r.json();
                if (d.errorcode) throw new Error(d.errormessage || 'Failed');
                currentShort = d.shorturl;
                document.getElementById('shortUrl').innerHTML = '<a href="'+d.shorturl+'" target="_blank">'+d.shorturl+'</a>';
                res.classList.add('show');
            } catch(ex) {
                err.textContent = '❌ ' + (ex.message || 'লিংক ছোট করা যায়নি। আবার চেষ্টা করুন।');
                err.style.display = 'block';
            } finally {
                btn.disabled = false; btn.textContent = '⚡ Shorten URL';
            }
        }
        function copyShort() {
            if(!currentShort) return;
            navigator.clipboard.writeText(currentShort);
        }
        function openShort() {
            if(currentShort) window.open(currentShort, '_blank');
        }
        function newQR() {
            if(currentShort) location.href = '/qrcode.html?text=' + encodeURIComponent(currentShort);
        }
    </script>
</body>
</html>
