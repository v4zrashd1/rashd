<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes — V4ZRASHD</title>
    <script defer src="/_vercel/insights/script.js"></script>
    <style>
        :root { --bg:#0a0a0f; --card:#1a1a24; --accent:#6c5ce7; --accent2:#00cec9; --text:#e9e9f0; --muted:#8b8ba3; --border:#2a2a38; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; min-height:100vh; padding:1.5rem; display:flex; justify-content:center; }
        .container { max-width:720px; width:100%; }
        .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; flex-wrap:wrap; gap:0.5rem; }
        h1 { font-size:1.5rem; }
        h1 span { background:linear-gradient(135deg,var(--accent),var(--accent2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
        .saved-label { color:var(--muted); font-size:0.8rem; }
        .toolbar { display:flex; gap:0.4rem; flex-wrap:wrap; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:0.6rem; margin-bottom:0.75rem; }
        .tool-btn { background:transparent; border:1px solid var(--border); border-radius:8px; color:var(--text); padding:0.45rem 0.7rem; font-size:0.8rem; cursor:pointer; transition:all 0.2s; }
        .tool-btn:hover { border-color:var(--accent2); color:var(--accent2); }
        .tool-btn.sep { border:none; color:var(--muted); cursor:default; }
        #editor { width:100%; min-height:420px; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:1.25rem; color:var(--text); font-size:0.95rem; line-height:1.7; outline:none; resize:vertical; font-family:inherit; }
        #editor:focus { border-color:var(--accent); }
        #editor:empty::before { content:attr(data-placeholder); color:var(--muted); font-style:italic; }
        .meta { display:flex; justify-content:space-between; color:var(--muted); font-size:0.75rem; margin-top:0.75rem; }
        .btn { padding:0.7rem 1.25rem; border:none; border-radius:10px; font-weight:600; font-size:0.85rem; cursor:pointer; transition:all 0.3s; }
        .btn-primary { background:linear-gradient(135deg,var(--accent),var(--accent2)); color:white; }
        .btn-primary:hover { transform:translateY(-2px); box-shadow:0 6px 20px rgba(108,92,231,0.4); }
        .btn-outline { background:transparent; border:1px solid var(--border); color:var(--muted); }
        .btn-outline:hover { border-color:#e74c3c; color:#e74c3c; }
        .back { text-align:center; margin-top:1.5rem; }
        .back a { color:var(--accent2); text-decoration:none; font-size:0.85rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📝 <span>Quick Notes</span></h1>
            <span class="saved-label" id="savedLabel">অটো-সেভ চালু</span>
        </div>
        <div class="toolbar">
            <button class="tool-btn" onclick="cmd('bold')"><b>B</b></button>
            <button class="tool-btn" onclick="cmd('italic')"><i>I</i></button>
            <button class="tool-btn" onclick="cmd('underline')"><u>U</u></button>
            <button class="tool-btn" onclick="cmd('strikeThrough')"><s>S</s></button>
            <span class="tool-btn sep">|</span>
            <button class="tool-btn" onclick="cmd('justifyLeft')">⬅</button>
            <button class="tool-btn" onclick="cmd('justifyCenter')">⬌</button>
            <button class="tool-btn" onclick="cmd('justifyRight')">➡</button>
            <span class="tool-btn sep">|</span>
            <button class="tool-btn" onclick="cmd('insertUnorderedList')">☰</button>
            <button class="tool-btn" onclick="cmd('insertOrderedList')">1.</button>
            <span class="tool-btn sep">|</span>
            <button class="tool-btn" onclick="cmd('undo')">↩ Undo</button>
            <button class="tool-btn" onclick="cmd('redo')">↪ Redo</button>
            <span class="tool-btn sep">|</span>
            <button class="tool-btn" onclick="insertLink()">🔗 Link</button>
        </div>
        <div id="editor" contenteditable="true" data-placeholder="এখানে আপনার নোট লিখুন... (অটোমেটিক সেভ হবে)"></div>
        <div class="meta">
            <span id="wordCount">০ শব্দ</span>
            <span id="charCount">০ অক্ষর</span>
        </div>
        <div class="header" style="margin-top:1rem">
            <button class="btn btn-primary" onclick="saveNote(true)">💾 Save Note</button>
            <button class="btn btn-outline" onclick="clearNote()">🗑️ Clear</button>
            <button class="btn btn-outline" onclick="downloadNote()">⬇️ Download</button>
        </div>
        <div class="back"><a href="/">← হোমে ফিরুন</a></div>
    </div>

    <script>
        const editor = document.getElementById('editor');
        const KEY = 'v4zrashd_note';
        // Load
        const saved = localStorage.getItem(KEY);
        if (saved) editor.innerHTML = saved;
        let saveTimer = null;
        function saveNote(manual) {
            localStorage.setItem(KEY, editor.innerHTML);
            const lbl = document.getElementById('savedLabel');
            lbl.textContent = '✓ সেভ হয়েছে ' + new Date().toLocaleTimeString();
            lbl.style.color = 'var(--accent2)';
            if (manual) setTimeout(function(){ lbl.textContent='অটো-সেভ চালু'; lbl.style.color=''; }, 2000);
        }
        editor.addEventListener('input', function() {
            updateCount();
            clearTimeout(saveTimer);
            saveTimer = setTimeout(function(){ saveNote(false); }, 800);
        });
        function cmd(c) { document.execCommand(c, false, null); editor.focus(); }
        function insertLink() {
            const url = prompt('লিংক URL দিন:', 'https://');
            if (url) document.execCommand('createLink', false, url);
        }
        function updateCount() {
            const txt = editor.innerText.trim();
            const words = txt ? txt.split(/\s+/).length : 0;
            document.getElementById('wordCount').textContent = words + ' শব্দ';
            document.getElementById('charCount').textContent = txt.length + ' অক্ষর';
        }
        function clearNote() {
            if (!confirm('নোট মুছে ফেলবেন?')) return;
            editor.innerHTML = '';
            localStorage.removeItem(KEY);
            updateCount();
        }
        function downloadNote() {
            const blob = new Blob([editor.innerHTML], {type:'text/html'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'v4zrashd-note.html';
            a.click();
        }
        updateCount();
    </script>
</body>
</html>
